<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Control</title>
<style>
:root{color-scheme:light;--ink:#172b3a;--muted:#6b7d8c;--paper:#f3f6f8;--card:#fff;--line:#e0e7ed;--accent:#176b67;--accent-dark:#10534f;--ok:#16794b;--bad:#bb3d4b;--warn:#9a6500;--r:12px;--shadow:0 12px 35px rgba(23,43,58,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Inter","Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit}
button{padding:.65rem 1rem;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease}
button:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(23,43,58,.1)}
button:active{transform:translateY(0)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-dark)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
button.small{padding:.4rem .7rem;font-size:.83rem}
:focus-visible{outline:3px solid #55a8e2;outline-offset:3px}
.app-shell{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;z-index:2;display:flex;flex-direction:column;width:252px;padding:1.5rem 1rem 1rem;background:#142c3c;color:#eaf2f5}
.brand{display:flex;align-items:center;gap:.8rem;padding:.15rem .55rem 1.8rem;color:inherit;text-decoration:none}
.brand-mark{display:grid;width:40px;height:40px;place-items:center;border-radius:13px;background:linear-gradient(145deg,#38a394,#16716c);color:white;font-size:.9rem;font-weight:800;letter-spacing:-.06em;box-shadow:0 5px 16px #0d635b66}
.brand-copy strong,.brand-copy span{display:block}
.brand-copy strong{font-size:.96rem;letter-spacing:.01em}
.brand-copy span{color:#a9bdc8;font-size:.7rem;letter-spacing:.13em;text-transform:uppercase}
.nav-label{margin:0 0 .6rem;padding:0 .75rem;color:#8098a5;font-size:.67rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
nav{display:grid;gap:.3rem}
nav button{display:flex;align-items:center;gap:.8rem;width:100%;padding:.72rem .75rem;border:1px solid transparent;background:transparent;color:#b6c7cf;text-align:left;font-size:.9rem}
nav button:hover{transform:none;background:#ffffff0d;box-shadow:none;color:#fff}
nav button[aria-current=page]{border-color:#ffffff12;background:linear-gradient(90deg,#207d75,#1a645f);color:#fff;box-shadow:0 5px 15px #0c242d4d}
.nav-icon{display:grid;width:24px;height:24px;place-items:center;border-radius:7px;background:#ffffff0c;color:#aed8d1;font-size:.8rem;font-weight:700}
nav button[aria-current=page] .nav-icon{background:#ffffff20;color:#fff}
.sidebar-foot{margin-top:auto;padding:.9rem .55rem .25rem;border-top:1px solid #ffffff18;color:#91a7b2;font-size:.75rem}
.sidebar-foot strong{display:block;margin-bottom:.2rem;color:#dbe7eb;font-size:.82rem}
.workspace{min-height:100vh;margin-left:252px}
.topbar{position:sticky;top:0;z-index:1;display:flex;min-height:70px;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem clamp(1.25rem,4vw,3.5rem);border-bottom:1px solid var(--line);background:#ffffffed;backdrop-filter:blur(14px)}
.eyebrow{color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.top-actions{display:flex;align-items:center;gap:.6rem}
.who{display:flex;align-items:center;gap:.55rem;margin-right:.3rem;color:#506575;font-size:.86rem}
.avatar{display:grid;width:34px;height:34px;place-items:center;border-radius:50%;background:#e1f1ed;color:var(--accent);font-size:.8rem;font-weight:700}
.topbar .quiet{padding:.5rem .7rem;border-color:transparent;background:transparent;color:#536878;font-size:.85rem}
#main{max-width:1440px;margin:0 auto;padding:2rem clamp(1.25rem,4vw,3.5rem) 4rem}
#main>*{animation:rise-in .38s cubic-bezier(.2,.75,.25,1) both}
#main>h2{margin:0 0 1.4rem;font-size:clamp(1.5rem,2.4vw,2rem);font-weight:700;letter-spacing:-.045em}
#main>h2:after{display:block;width:38px;height:3px;margin-top:.6rem;border-radius:3px;background:var(--accent);content:""}
h3{margin:0 0 .7rem;font-size:1rem}
.panel{margin-bottom:1.1rem;padding:1.25rem 1.35rem;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
.panel:hover{box-shadow:0 15px 38px rgba(23,43,58,.09)}
.row{display:flex;flex-wrap:wrap;gap:.8rem;align-items:flex-end}
.grow{flex:1 1 220px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
label{display:block;color:#526676;font-size:.82rem;font-weight:600}
input,select{display:block;width:100%;margin-top:.4rem;padding:.72rem .8rem;border:1px solid #d4dee5;border-radius:9px;background:#fbfcfd;color:var(--ink);transition:border-color .18s ease,box-shadow .18s ease}
input:focus,select:focus{border-color:#5a9e98;outline:0;box-shadow:0 0 0 3px #176b671a}
input::placeholder{color:#9baab4}
dl{display:grid;grid-template-columns:minmax(105px,auto) 1fr;gap:.55rem 1rem;margin:0}
dt{color:var(--muted)}dd{margin:0;font-weight:600}
.banner{margin-bottom:1rem;padding:.9rem 1rem;border:1px solid;border-radius:10px;font-weight:600}
.banner.ok{border-color:#b6dfca;background:#effaf4;color:#176340}
.banner.bad{border-color:#efc3c8;background:#fff3f4;color:#a12e3b}
.banner.warn{border-color:#ead7a7;background:#fff9e9;color:#785000}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--card);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{padding:.8rem .9rem;border-bottom:1px solid #edf1f4;text-align:left;font-size:.88rem;vertical-align:middle}
th{background:#f5f8fa;color:#607383;font-size:.72rem;font-weight:700;letter-spacing:.065em;text-transform:uppercase}
tbody tr{transition:background .16s ease}
tbody tr:hover{background:#f7fafb}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:.18rem .58rem;border:1px solid var(--line);border-radius:99px;background:#f8fafb;font-size:.75rem;font-weight:600}
.tag.active,.tag.verified{border-color:#b6dfca;background:#effaf4;color:#176340}
.tag.lost,.tag.stolen,.tag.mismatch{border-color:#efc3c8;background:#fff3f4;color:#a12e3b}
.tag.decommissioned{color:var(--muted)}
.login-screen{display:grid;min-height:100vh;grid-template-columns:minmax(340px,1.05fr) minmax(420px,.95fr);background:#f5f7f8}
.login-story{position:relative;display:flex;overflow:hidden;flex-direction:column;justify-content:space-between;padding:clamp(2rem,6vw,5rem);background:radial-gradient(ellipse at 85% 12%,#27867e66,transparent 38%),linear-gradient(145deg,#142c3c,#193e4d 60%,#176b67);color:#fff}
.login-story:before,.login-story:after{position:absolute;width:440px;height:440px;border:1px solid #ffffff12;border-radius:50%;content:"";pointer-events:none}
.login-story:before{right:-180px;bottom:-130px;box-shadow:0 0 0 40px #ffffff08,0 0 0 90px #ffffff06,0 0 0 145px #ffffff04}
.login-story:after{right:10%;bottom:15%;width:130px;height:130px;border-color:#ffffff1a}
.login-story>*{position:relative;z-index:1}
.login-story h1{max-width:560px;margin:2rem 0 1rem;font-size:clamp(2.4rem,5vw,4.5rem);line-height:1.05;letter-spacing:-.065em}
.login-story p{max-width:490px;color:#c3d6dd;font-size:1.05rem}
.login-note{color:#a5bbc4;font-size:.78rem}
.login-brand{display:flex;align-items:center;gap:.75rem}
.login-brand .brand-mark{width:45px;height:45px}
.login-brand strong,.login-brand span{display:block}
.login-brand span{color:#a9c0c8;font-size:.75rem}
.login-features{display:grid;gap:.7rem;margin-top:2rem}
.login-features span{display:flex;align-items:center;gap:.65rem;color:#e0ebee;font-size:.87rem}
.login-features span:before{display:grid;width:22px;height:22px;place-items:center;border:1px solid #ffffff30;border-radius:50%;color:#9de0d2;content:"✓";font-size:.72rem}
.login-side{display:grid;place-items:center;padding:2rem}
.login{width:min(100%,420px);margin:0;padding:clamp(1.5rem,4vw,2.5rem);border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 24px 70px #172b3a12;animation:rise-in .55s cubic-bezier(.2,.75,.25,1) both}
.login h2{margin:0 0 .3rem;font-size:1.7rem;letter-spacing:-.04em}
.login-intro{margin:0 0 1.7rem;color:var(--muted)}
.login label+label{margin-top:1rem}
.login .primary{width:100%;margin-top:1.35rem;padding:.78rem}
#reader{max-width:440px;margin-top:1rem}
dialog{width:min(92vw,400px);max-width:400px;padding:1.4rem;border:1px solid var(--line);border-radius:16px;box-shadow:0 25px 80px #172b3a44;animation:rise-in .22s ease both}
dialog::backdrop{background:#10243180;backdrop-filter:blur(3px)}
.label{text-align:center;margin-bottom:1rem}
.label img{width:220px;height:220px}
.label strong{display:block;font-size:1.2rem}
#toast{position:fixed;left:50%;bottom:1.5rem;z-index:5;transform:translateX(-50%);padding:.75rem 1.1rem;border:1px solid #ffffff1a;border-radius:10px;background:#142c3c;color:#fff;box-shadow:0 8px 25px #142c3c33;animation:rise-in .2s ease both}
@keyframes rise-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.sidebar{width:218px}.workspace{margin-left:218px}.login-screen{grid-template-columns:minmax(300px,.9fr) minmax(360px,1.1fr)}.login-story{padding:2.25rem}.login-story h1{font-size:3rem}}
@media(max-width:760px){.login-screen{grid-template-columns:1fr}.login-story{min-height:260px;padding:1.5rem}.login-story h1{margin:1rem 0 .4rem;font-size:2.5rem}.login-story p,.login-features,.login-note{display:none}.login-side{padding:1.3rem}.login{padding:1.5rem}.app-shell{min-height:100vh}.sidebar{position:relative;width:auto;padding:.8rem 1rem .65rem}.brand{padding:0 0 .75rem}.sidebar .nav-label,.sidebar-foot{display:none}nav{display:flex;gap:.35rem;overflow-x:auto;padding-bottom:.05rem}nav button{width:auto;flex:none;padding:.55rem .65rem;white-space:nowrap;font-size:.8rem}nav button .nav-icon{width:20px;height:20px}.workspace{margin-left:0}.topbar{position:relative;min-height:58px;padding:.55rem 1rem}.eyebrow{font-size:.65rem}.who{font-size:0}.avatar{font-size:.78rem}.topbar .quiet{padding:.45rem;font-size:.77rem}#main{padding:1.35rem 1rem 3rem}.panel{padding:1rem}.tablewrap{border-radius:9px}}
@media(max-width:600px){.login-screen{grid-template-columns:1fr}.login-story{min-height:250px;padding:1.5rem}.login-story h1{margin:1.4rem 0 .5rem;font-size:2.3rem}.login-story p,.login-features,.login-note{display:none}.login-side{padding:1.3rem}.login{padding:1.5rem}.login-brand .brand-mark{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{
  body.printing>*:not(#root){display:none!important}
  body.printing #root>*:not(.label-dialog){display:none!important}
  body.printing #labelDialog{display:block!important;border:0;position:static}
  body.printing #labelDialog .row{display:none}
}
</style>
</head>
<body>
<script src="/vendor/html5-qrcode/html5-qrcode.min.js"></script>
<div id="root"></div>
<script defer src="/app.js"></script>
</body>
</html>
